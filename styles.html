<style>
  :root{
    color-scheme:light;
    --blue:#005ca9;--blue-dark:#00447c;--green:#00843d;--green-dark:#006b31;
    --bg:#f3f6f8;--card:#ffffff;--line:#dbe3e8;--ink:#24313d;--ink-2:#4d5d68;--muted:#667784;
    --soft:#f4f8fa;--danger:#b42318;--danger-soft:#fff1f0;--shadow:0 10px 28px rgba(31,52,67,.09);
    --font:"Univers","Univers LT Std","Univers Next Pro","Zurich BT","Zurich",Arial,"Helvetica Neue",sans-serif;
    /* gráficos (paleta validada para daltonismo) */
    --chart-surface:#ffffff;--grid:#e1e0d9;--axis:#c3c2b7;--chart-ink:#0b0b0b;--chart-ink-2:#52514e;--chart-muted:#898781;
    --series-1:#2a78d6;--priority-tint:rgba(235,104,52,.10);--priority-ink:#b3471b;
    --ord5-0:#86b6ef;--ord5-1:#5598e7;--ord5-2:#2a78d6;--ord5-3:#1c5cab;--ord5-4:#104281;
    --ord3-0:#86b6ef;--ord3-1:#2a78d6;--ord3-2:#104281;
    --na:#c3c2b7;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --blue:#5598e7;--blue-dark:#9ec5f4;--green:#0ca30c;--green-dark:#4cc26a;
      --bg:#0d0d0d;--card:#1a1a19;--line:#2c2c2a;--ink:#f2f2ef;--ink-2:#c3c2b7;--muted:#a3a29a;
      --soft:#232322;--danger:#f97066;--danger-soft:#3a1d1b;--shadow:none;
      --chart-surface:#1a1a19;--grid:#2c2c2a;--axis:#383835;--chart-ink:#ffffff;--chart-ink-2:#c3c2b7;--chart-muted:#898781;
      --series-1:#3987e5;--priority-tint:rgba(217,89,38,.16);--priority-ink:#f08a5d;
      --ord5-0:#184f95;--ord5-1:#256abf;--ord5-2:#3987e5;--ord5-3:#6da7ec;--ord5-4:#9ec5f4;
      --ord3-0:#184f95;--ord3-1:#3987e5;--ord3-2:#9ec5f4;
      --na:#52514e;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.45}
  .topbar{height:8px;background:linear-gradient(90deg,#005ca9 0 55%,#00843d 55%)}
  .shell{max-width:1240px;margin:0 auto;padding:20px 16px 48px}

  .brand{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
  .eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
  .brand h1{margin:0 0 4px;font-size:21px;line-height:1.25;color:var(--blue-dark);font-weight:700;font-style:italic}
  .sub{margin:0;color:var(--muted);font-size:13px}
  .brand-actions{display:flex;gap:8px;flex-wrap:wrap}

  .btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
  .btn-sm{padding:8px 12px;font-size:13px}
  .btn-primary{background:#005ca9;color:#fff}.btn-primary:hover{background:#00447c}
  .btn-secondary{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn-secondary:hover{border-color:var(--muted)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-link{background:none;border:0;padding:4px 6px;font:inherit;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer;border-radius:6px}
  .btn-link:hover{background:var(--soft)}

  .tabs{display:flex;gap:4px;overflow-x:auto;margin:16px 0 0;padding-bottom:2px;scrollbar-width:thin}
  .tabs button{flex:none;border:0;background:none;font:inherit;font-weight:700;font-size:14px;color:var(--muted);padding:10px 14px;border-radius:10px 10px 0 0;border-bottom:3px solid transparent;cursor:pointer}
  .tabs button:hover{color:var(--ink)}
  .tabs button.active{color:var(--blue-dark);border-bottom-color:var(--green);background:var(--card)}

  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:12px 14px}
  .filters label,.open-controls label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
  select,input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:180px}
  select:focus,input:focus{outline:2px solid var(--blue);outline-offset:1px}
  .filter-count{margin-left:auto;font-size:13px;color:var(--muted)}

  .alert{margin-top:14px;background:var(--danger-soft);border:1px solid #f0b7b2;color:var(--danger);border-radius:10px;padding:12px}
  .loading{text-align:center;color:var(--muted);padding:40px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;box-shadow:var(--shadow);min-width:0}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
  .card-title{margin:0;font-size:16px;color:var(--blue-dark);font-weight:700;font-style:italic}
  .card-note{margin:4px 0 0;font-size:12px;color:var(--muted)}
  .card-actions{display:flex;gap:2px;flex:none}
  .chart-box{position:relative;width:100%}
  /* gráficos SVG */
  .chart-box svg{display:block;width:100%;overflow:visible}
  .chart-box .hit{cursor:pointer}
  .tip{position:absolute;z-index:5;pointer-events:none;max-width:320px;background:var(--card);color:var(--chart-ink-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.14)}
  .tip b{display:block;color:var(--chart-ink);margin-bottom:2px}
  .tip .row{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tip i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
  .empty{padding:36px 10px;text-align:center;color:var(--muted);font-size:14px}
  .panel-note{margin:14px 0 0;font-size:13px;color:var(--muted)}
  .howto{font-size:14px;color:var(--ink-2)}
  .howto li{margin:4px 0}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .grid-2>.card{margin-top:14px}
  .grid-wide-left{grid-template-columns:1.4fr 1fr}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .tile .v{font-size:30px;font-weight:700;color:var(--ink);line-height:1.1}
  .tile .l{font-size:12px;color:var(--muted);margin-top:4px}

  .data-table-wrap{overflow:auto;max-height:520px;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  table.data-table{width:100%;border-collapse:collapse;font-size:13px}
  .data-table th,.data-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .data-table th{position:sticky;top:0;background:var(--soft);color:var(--ink-2);font-weight:700;white-space:nowrap}
  .data-table td.num,.data-table th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .quad{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2)}
  .quad.prio{border-color:transparent;background:var(--priority-tint);color:var(--priority-ink)}

  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 8px;font-size:12px;color:var(--chart-ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

  .text-list{list-style:none;margin:10px 0 0;padding:0;max-height:560px;overflow:auto}
  .text-list li{padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px;white-space:pre-wrap}
  .text-list .meta{display:block;font-size:11px;color:var(--muted);margin-top:3px;white-space:normal}
  .open-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .open-controls .grow{flex:1;min-width:200px}
  .open-controls .grow input{width:100%}
  .cat-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .footer{text-align:center;color:var(--muted);font-size:12px;padding-top:24px}

  body[data-tab="visao"] .f-tarefas,body[data-tab="barreiras"] .f-tarefas,body[data-tab="tecnologias"] .f-tarefas,body[data-tab="categorias"] .f-tarefas{display:none}
  body:not([data-tab="matriz"]) .f-matriz{display:none}

  @media(max-width:860px){
    .grid-2,.grid-wide-left{grid-template-columns:1fr}
    .filter-count{margin-left:0;width:100%}
    select,input[type=search]{min-width:0;width:100%}
    .filters label{flex:1 1 150px}
    .brand h1{font-size:18px}
  }
</style>
