<script>
(function () {
  'use strict';

  /* ================= configurações de texto ================= */
  var TREINAMENTOS = ['Nunca ocorreu', 'Menos de 7 dias (1 semana)', 'Entre 7 e 30 dias (1 mês)', 'Entre 1 e 3 meses',
    'Entre 3 e 6 meses', 'Entre 6 e 12 meses (1 ano)', 'Entre 1 e 5 anos', 'Acima de 5 anos'];
  var MODOS = ['Manual', 'Parcial (semiautomatizado)', 'Totalmente automatizado'];
  var CODIGOS = ['0 · Não conheço', '1 · Conheço, mas não há na unidade/setor', '2 · Existe, mas nunca utilizei',
    '3 · Uso ocasionalmente', '4 · Uso na rotina', '5 · Não consigo opinar'];
  var BARREIRAS_CURTAS = {
    'Falta energia elétrica estável no setor.': 'Falta de energia elétrica estável',
    'O sinal de internet ou de celular no setor é insuficiente.': 'Sinal de internet/celular insuficiente',
    'O setor apresenta muita poeira, calor e umidade.': 'Poeira, calor e umidade',
    'O setor apresenta problemas na infraestrutura física das instalações (ex.: cercas inadequadas, espaços reduzidos para equipamentos, falta de proteção contra chuva etc.).': 'Problemas na infraestrutura física',
    'Ausência de equipamento.': 'Ausência de equipamento'
  };
  var QUADRANTES = {
    prio: 'Prioridade para automação', manter: 'Manter e aprimorar',
    monitorar: 'Monitorar', baixa: 'Baixa prioridade'
  };

  var S = { raw: null, tab: 'visao', charts: {}, tables: {}, f: { perfil: '', area: '', origem: '', minCit: 1 } };

  /* ================= utilitários ================= */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>'"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
    });
  }
  function chave(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLocaleLowerCase('pt-BR').replace(/\s+/g, ' ').trim();
  }
  function num(v) { if (v === '' || v == null) return null; var n = Number(v); return isNaN(n) ? null : n; }
  function media(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : null; }
  function fmt(n, d) {
    if (n == null || isNaN(n)) return '—';
    d = d == null ? 1 : d;
    return n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function pct(a, b) { return b ? a / b * 100 : 0; }
  function tok(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function areasDe(r) { return String(r.areas || '').split(' | ').map(function (a) { return a.trim(); }).filter(Boolean); }
  function slug(s) { return chave(s).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); }
  function curto(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  /* ================= dados filtrados ================= */
  function view() {
    var R = S.raw, f = S.f;
    var resp = R.respostas.filter(function (r) {
      return (!f.perfil || r.perfil === f.perfil) && (!f.area || areasDe(r).indexOf(f.area) !== -1);
    });
    var ids = {};
    resp.forEach(function (r) { ids[r.response_id] = r; });
    var tar = R.tarefas.filter(function (t) { return ids[t.response_id]; });
    var tarO = tar.filter(function (t) {
      if (f.origem === 'tempo') return t.origem_tempo === 'sim' || /tempo/.test(t.origem);
      if (f.origem === 'esforco') return t.origem_esforco === 'sim' || /esforco/.test(t.origem);
      return true;
    });
    var tec = R.tecnologias.filter(function (t) { return ids[t.response_id]; });
    return { resp: resp, ids: ids, tar: tar, tarO: tarO, tec: tec };
  }

  /** Agrupa as tarefas por categoria (planilha de análises) ou pelo texto normalizado. */
  function agrupar(tarefas) {
    var g = {};
    tarefas.forEach(function (t) {
      var k = chave(t.tarefa);
      if (!k) return;
      var cat = S.raw.categorias[k];
      var gk = cat ? 'c:' + chave(cat) : 't:' + k;
      var o = g[gk] || (g[gk] = { cat: cat || '', textos: {}, n: 0, imp: [], sat: [], modo: {}, resp: {} });
      o.n++;
      o.textos[t.tarefa] = (o.textos[t.tarefa] || 0) + 1;
      var i = num(t.importancia_1_5), s = num(t.satisfacao_1_5);
      if (i != null) o.imp.push(i);
      if (s != null) o.sat.push(s);
      o.modo[t.modo_execucao] = (o.modo[t.modo_execucao] || 0) + 1;
      o.resp[t.response_id] = 1;
    });
    return Object.keys(g).map(function (k) {
      var o = g[k];
      var textos = Object.keys(o.textos).sort(function (a, b) { return o.textos[b] - o.textos[a]; });
      var imp = media(o.imp), sat = media(o.sat);
      var gap = imp != null && sat != null ? imp - sat : null;
      var quad = imp == null || sat == null ? '' : imp >= 3 ? (sat < 3 ? 'prio' : 'manter') : (sat < 3 ? 'monitorar' : 'baixa');
      return {
        label: o.cat || textos[0], categorizada: !!o.cat, variantes: textos, n: o.n,
        respondentes: Object.keys(o.resp).length, imp: imp, sat: sat, gap: gap,
        opp: imp == null ? null : imp + Math.max(gap || 0, 0), quad: quad, modo: o.modo
      };
    }).sort(function (a, b) { return b.n - a.n || (b.opp || 0) - (a.opp || 0) || a.label.localeCompare(b.label); });
  }

  /* ================= gráficos em SVG (sem bibliotecas externas) ================= */
  var NS = 'http://www.w3.org/2000/svg';
  var measure = document.createElement('canvas').getContext('2d');
  function fontFam() { return tok('--font') || 'Arial, sans-serif'; }
  function textW(t, size, weight) { measure.font = (weight || 500) + ' ' + (size || 12) + 'px ' + fontFam(); return measure.measureText(String(t)).width; }
  function fitText(t, maxW, size, weight) {
    t = String(t);
    if (textW(t, size, weight) <= maxW) return t;
    while (t.length > 1 && textW(t + '…', size, weight) > maxW) t = t.slice(0, -1);
    return t + '…';
  }
  function el(tag, attrs, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function svgRoot(box, w, h) {
    box.innerHTML = '';
    box.style.height = h + 'px';
    var svg = el('svg', { width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, 'font-family': fontFam(), 'font-size': 12, role: 'img' }, box);
    return svg;
  }
  function niceStep(max, count) {
    if (max <= 0) return 1;
    var raw = max / (count || 4), p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    var step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
    return step < 1 ? 1 : step;
  }
  /** Retângulo com cantos arredondados só na ponta do dado (a base fica reta). */
  function barPath(x, y, w, h, r, horizontal) {
    if (w <= 0 || h <= 0) return '';
    if (horizontal) {
      r = Math.min(r, w, h / 2);
      return 'M' + x + ',' + y + 'h' + (w - r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r + 'v' + (h - 2 * r) + 'a' + r + ',' + r + ' 0 0 1 ' + (-r) + ',' + r + 'h' + (-(w - r)) + 'z';
    }
    r = Math.min(r, h, w / 2);
    return 'M' + x + ',' + (y + h) + 'v' + (-(h - r)) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + (-r) + 'h' + (w - 2 * r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r + 'v' + (h - r) + 'z';
  }

  /* ---- dica flutuante ---- */
  function tipFor(box) {
    var t = box.querySelector('.tip');
    if (!t) { t = document.createElement('div'); t.className = 'tip'; t.hidden = true; box.appendChild(t); }
    return t;
  }
  function bindTip(box, target, htmlFn) {
    var show = function (e) {
      var t = tipFor(box); t.innerHTML = htmlFn(); t.hidden = false;
      var r = box.getBoundingClientRect();
      var x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
      if (x + t.offsetWidth > r.width) x = Math.max(0, e.clientX - r.left - t.offsetWidth - 14);
      if (y + t.offsetHeight > r.height) y = Math.max(0, e.clientY - r.top - t.offsetHeight - 14);
      t.style.left = x + 'px'; t.style.top = y + 'px';
    };
    target.addEventListener('pointermove', show);
    target.addEventListener('pointerdown', show);
    target.addEventListener('pointerleave', function () { tipFor(box).hidden = true; });
  }
  function tipRow(color, text) { return '<span class="row">' + (color ? '<i style="background:' + color + '"></i>' : '') + esc(text) + '</span>'; }

  /* ---- barras horizontais (uma série) ---- */
  function hbar(box, o) {
    var W = box.clientWidth || 600, n = o.labels.length, rowH = o.rowH || 30;
    var top = 6, bottom = 26, H = top + n * rowH + bottom;
    var labelW = Math.min(Math.max.apply(null, o.labels.map(function (l) { return textW(l, 12, 600); }).concat([40])) + 10, W * 0.48);
    var right = o.valueLabel ? 76 : 16;
    var x0 = labelW, x1 = W - right, pw = Math.max(40, x1 - x0);
    var maxV = o.max || Math.max.apply(null, o.values.concat([1]));
    var step = o.max === 100 ? 25 : niceStep(maxV, 4);
    var dom = o.max || Math.ceil(maxV / step) * step;
    var sx = function (v) { return x0 + (v / dom) * pw; };
    var svg = svgRoot(box, W, H), g = el('g', {}, svg);
    for (var t = 0; t <= dom + 1e-9; t += step) {
      el('line', { x1: sx(t), x2: sx(t), y1: top, y2: top + n * rowH, stroke: tok('--grid'), 'stroke-width': 1 }, g);
      el('text', { x: sx(t), y: H - 8, 'text-anchor': 'middle', fill: tok('--chart-muted') }, g, o.tickFmt ? o.tickFmt(t) : fmt(t, step < 1 ? 1 : 0));
    }
    el('line', { x1: x0, x2: x0, y1: top, y2: top + n * rowH, stroke: tok('--axis'), 'stroke-width': 1 }, g);
    var thick = Math.min(20, rowH * 0.62), color = tok('--series-1');
    o.labels.forEach(function (lab, i) {
      var cy = top + i * rowH + rowH / 2;
      el('text', { x: x0 - 8, y: cy, 'text-anchor': 'end', 'dominant-baseline': 'middle', fill: tok('--chart-ink-2'), 'font-weight': 600 }, g, fitText(lab, labelW - 12, 12, 600));
      var w = sx(o.values[i]) - x0;
      el('path', { d: barPath(x0, cy - thick / 2, w, thick, 4, true), fill: color }, g);
      if (o.valueLabel) el('text', { x: x0 + w + 6, y: cy, 'dominant-baseline': 'middle', fill: tok('--chart-ink-2'), 'font-weight': 600 }, g, o.valueLabel(i));
      var hit = el('rect', { x: 0, y: cy - rowH / 2, width: W, height: rowH, fill: 'transparent', class: 'hit' }, g);
      bindTip(box, hit, function () { return '<b>' + esc(lab) + '</b>' + tipRow(color, o.tooltip ? o.tooltip(i) : String(o.values[i])); });
    });
    return svg;
  }

  /* ---- barras verticais (uma série) ---- */
  function vbar(box, o) {
    var W = box.clientWidth || 500, H = o.height || 240, left = 36, top = 10, bottom = 28;
    var n = o.labels.length, pw = W - left - 10, ph = H - top - bottom;
    var maxV = Math.max.apply(null, o.values.concat([1])), step = niceStep(maxV, 4), dom = Math.ceil(maxV / step) * step;
    var sy = function (v) { return top + ph - (v / dom) * ph; };
    var svg = svgRoot(box, W, H), g = el('g', {}, svg), color = tok('--series-1');
    for (var t = 0; t <= dom + 1e-9; t += step) {
      el('line', { x1: left, x2: W - 10, y1: sy(t), y2: sy(t), stroke: tok('--grid') }, g);
      el('text', { x: left - 6, y: sy(t), 'text-anchor': 'end', 'dominant-baseline': 'middle', fill: tok('--chart-muted') }, g, fmt(t, 0));
    }
    el('line', { x1: left, x2: W - 10, y1: sy(0), y2: sy(0), stroke: tok('--axis') }, g);
    var slot = pw / n, bw = Math.min(44, slot * 0.6);
    o.labels.forEach(function (lab, i) {
      var cx = left + slot * i + slot / 2, h = sy(0) - sy(o.values[i]);
      el('path', { d: barPath(cx - bw / 2, sy(o.values[i]), bw, h, 4, false), fill: color }, g);
      el('text', { x: cx, y: H - 8, 'text-anchor': 'middle', fill: tok('--chart-ink-2'), 'font-weight': 600 }, g, lab);
      var hit = el('rect', { x: cx - slot / 2, y: top, width: slot, height: ph, fill: 'transparent', class: 'hit' }, g);
      bindTip(box, hit, function () { return '<b>' + esc(lab) + '</b>' + tipRow(color, o.tooltip ? o.tooltip(i) : String(o.values[i])); });
    });
    return svg;
  }

  /* ---- barras horizontais empilhadas 100% ---- */
  function hstack(box, o) {
    var W = box.clientWidth || 700, n = o.labels.length, rowH = o.rowH || 28, top = 4, bottom = 26;
    var H = top + n * rowH + bottom;
    var labelW = Math.min(Math.max.apply(null, o.labels.map(function (l) { return textW(l, 12, 600); }).concat([40])) + 10, W * 0.45);
    var x0 = labelW, pw = Math.max(60, W - 12 - x0);
    var sx = function (v) { return x0 + v / 100 * pw; };
    var svg = svgRoot(box, W, H), g = el('g', {}, svg), surface = tok('--chart-surface');
    [0, 25, 50, 75, 100].forEach(function (t) {
      el('line', { x1: sx(t), x2: sx(t), y1: top, y2: top + n * rowH, stroke: tok('--grid') }, g);
      el('text', { x: sx(t), y: H - 8, 'text-anchor': 'middle', fill: tok('--chart-muted') }, g, t + '%');
    });
    var thick = Math.min(18, rowH * 0.64);
    o.labels.forEach(function (lab, i) {
      var cy = top + i * rowH + rowH / 2, acc = 0;
      el('text', { x: x0 - 8, y: cy, 'text-anchor': 'end', 'dominant-baseline': 'middle', fill: tok('--chart-ink-2'), 'font-weight': 600 }, g, fitText(lab, labelW - 12, 12, 600));
      o.series.forEach(function (s) {
        var v = s.data[i] || 0;
        if (v > 0) {
          var xa = sx(acc), xb = sx(acc + v);
          // 2px de espaço (cor da superfície) entre segmentos
          el('rect', { x: xa + (acc > 0 ? 1 : 0), y: cy - thick / 2, width: Math.max(0.5, xb - xa - (acc > 0 ? 1 : 0) - 1), height: thick, fill: s.color }, g);
        }
        acc += v;
      });
      var hit = el('rect', { x: 0, y: cy - rowH / 2, width: W, height: rowH, fill: 'transparent', class: 'hit' }, g);
      bindTip(box, hit, function () {
        return '<b>' + esc(o.tipTitle ? o.tipTitle(i) : lab) + '</b>' + o.series.map(function (s) {
          return tipRow(s.color, s.label + ': ' + fmt(s.data[i] || 0, 0) + '%' + (s.counts ? ' (' + s.counts[i] + ')' : ''));
        }).join('');
      });
    });
    el('line', { x1: x0, x2: x0, y1: top, y2: top + n * rowH, stroke: tok('--axis') }, g);
    return svg;
  }

  /* ---- matriz de bolhas Importância × Satisfação ---- */
  function bubble(box, o) {
    var W = box.clientWidth || 700, H = o.height || 520;
    var m = { l: 58, r: 16, t: 14, b: 52 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
    var lo = 0.75, hi = 5.25;
    var sx = function (v) { return m.l + (v - lo) / (hi - lo) * pw; };
    var sy = function (v) { return m.t + ph - (v - lo) / (hi - lo) * ph; };
    var svg = svgRoot(box, W, H), g = el('g', {}, svg);
    // quadrante prioritário
    el('rect', { x: sx(lo), y: sy(hi), width: sx(3) - sx(lo), height: sy(3) - sy(hi), fill: tok('--priority-tint') }, g);
    [1, 2, 3, 4, 5].forEach(function (t) {
      el('line', { x1: sx(t), x2: sx(t), y1: m.t, y2: m.t + ph, stroke: tok('--grid') }, g);
      el('line', { x1: m.l, x2: m.l + pw, y1: sy(t), y2: sy(t), stroke: tok('--grid') }, g);
      el('text', { x: sx(t), y: m.t + ph + 18, 'text-anchor': 'middle', fill: tok('--chart-muted') }, g, t);
      el('text', { x: m.l - 10, y: sy(t), 'text-anchor': 'end', 'dominant-baseline': 'middle', fill: tok('--chart-muted') }, g, t);
    });
    el('line', { x1: sx(3), x2: sx(3), y1: m.t, y2: m.t + ph, stroke: tok('--axis'), 'stroke-width': 1.5 }, g);
    el('line', { x1: m.l, x2: m.l + pw, y1: sy(3), y2: sy(3), stroke: tok('--axis'), 'stroke-width': 1.5 }, g);
    el('rect', { x: m.l, y: m.t, width: pw, height: ph, fill: 'none', stroke: tok('--axis') }, g);
    el('text', { x: m.l + pw / 2, y: H - 10, 'text-anchor': 'middle', fill: tok('--chart-ink-2'), 'font-weight': 700 }, g, 'Satisfação com a solução atual (média, 1–5)');
    el('text', { x: 16, y: m.t + ph / 2, 'text-anchor': 'middle', fill: tok('--chart-ink-2'), 'font-weight': 700, transform: 'rotate(-90 16 ' + (m.t + ph / 2) + ')' }, g, 'Importância de melhorar (média, 1–5)');
    // nomes dos quadrantes (abreviados em telas estreitas)
    var estreito = pw < 480;
    var qn = estreito ? { prio: 'Prioridade', manter: 'Manter', monitorar: 'Monitorar', baixa: 'Baixa prior.' } : QUADRANTES;
    var fs = estreito ? 11 : 12;
    el('text', { x: sx(lo) + 6, y: sy(hi) + 15, fill: tok('--priority-ink'), 'font-weight': 700, 'font-size': fs }, g, qn.prio);
    el('text', { x: sx(hi) - 6, y: sy(hi) + 15, 'text-anchor': 'end', fill: tok('--chart-muted'), 'font-weight': 600, 'font-size': fs }, g, qn.manter);
    el('text', { x: sx(lo) + 6, y: sy(lo) - 8, fill: tok('--chart-muted'), 'font-weight': 600, 'font-size': fs }, g, qn.monitorar);
    el('text', { x: sx(hi) - 6, y: sy(lo) - 8, 'text-anchor': 'end', fill: tok('--chart-muted'), 'font-weight': 600, 'font-size': fs }, g, qn.baixa);
    // bolhas proporcionais à largura do gráfico
    var escala = Math.max(0.45, Math.min(1, pw / 620));

    var color = tok('--series-1'), surface = tok('--chart-surface');
    var pts = o.points.map(function (p) { return Object.assign({}, p, { r: Math.max(4, p.r * escala) }); })
      .sort(function (a, b) { return b.r - a.r; });
    var marks = el('g', {}, svg), labels = el('g', {}, svg);
    pts.forEach(function (p) {
      var cx = sx(p.x), cy = sy(p.y);
      p.cx = cx; p.cy = cy;
      var c = el('circle', { cx: cx, cy: cy, r: p.r, fill: color, 'fill-opacity': 0.72, stroke: surface, 'stroke-width': 2 }, marks);
      var hit = el('circle', { cx: cx, cy: cy, r: p.r + 5, fill: 'transparent', class: 'hit' }, marks);
      hit.addEventListener('pointerenter', function () { c.setAttribute('fill-opacity', 1); c.setAttribute('stroke', tok('--chart-ink')); });
      hit.addEventListener('pointerleave', function () { c.setAttribute('fill-opacity', 0.72); c.setAttribute('stroke', surface); });
      bindTip(box, hit, function () { return o.tooltip(p); });
    });

    // Rótulos diretos: procura uma posição livre (direita, esquerda, acima, abaixo);
    // se nenhuma couber sem sobrepor, o nome fica só na dica ao passar o mouse.
    var placed = [];
    var overlapsRect = function (a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; };
    var overlapsCircle = function (b, q) {
      var nx = Math.max(b.x, Math.min(q.cx, b.x + b.w)), ny = Math.max(b.y, Math.min(q.cy, b.y + b.h));
      return (nx - q.cx) * (nx - q.cx) + (ny - q.cy) * (ny - q.cy) < q.r * q.r;
    };
    var hidden = 0;
    pts.filter(function (p) { return p.rotulo; }).sort(function (a, b) { return (b.g.opp || 0) - (a.g.opp || 0); }).forEach(function (p) {
      var txt = fitText(p.label, 180, 12, 700), w = textW(txt, 12, 700), h = 15, gap = 5;
      var cands = [
        { x: p.cx + p.r + gap, y: p.cy - h / 2, a: 'start' },
        { x: p.cx - p.r - gap - w, y: p.cy - h / 2, a: 'end' },
        { x: p.cx - w / 2, y: p.cy - p.r - gap - h, a: 'middle' },
        { x: p.cx - w / 2, y: p.cy + p.r + gap, a: 'middle' }
      ];
      var ok = null;
      for (var i = 0; i < cands.length && !ok; i++) {
        var b = { x: cands[i].x, y: cands[i].y, w: w, h: h };
        if (b.x < m.l + 2 || b.x + b.w > m.l + pw - 2 || b.y < m.t + 20 || b.y + b.h > m.t + ph - 2) continue;
        if (placed.some(function (q) { return overlapsRect(b, q); })) continue;
        if (pts.some(function (q) { return q !== p && overlapsCircle(b, q); })) continue;
        ok = { b: b, a: cands[i].a };
      }
      if (!ok) { hidden++; return; }
      placed.push(ok.b);
      var tx = ok.a === 'start' ? ok.b.x : ok.a === 'end' ? ok.b.x + w : ok.b.x + w / 2;
      el('text', { x: tx, y: ok.b.y + h / 2, 'text-anchor': ok.a, 'dominant-baseline': 'middle', fill: tok('--chart-ink'), 'font-weight': 700, stroke: surface, 'stroke-width': 3, 'paint-order': 'stroke' }, labels, txt);
    });
    return svg;
  }

  /* ---- exportar PNG a partir do SVG ---- */
  function svgPng(svg, nome) {
    var w = Number(svg.getAttribute('width')), h = Number(svg.getAttribute('height'));
    var clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', NS);
    var bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('width', w); bg.setAttribute('height', h); bg.setAttribute('fill', tok('--chart-surface'));
    clone.insertBefore(bg, clone.firstChild);
    $$('.hit', clone).forEach(function (n) { n.remove(); });
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas'), k = 2;
      c.width = w * k; c.height = h * k;
      var ctx = c.getContext('2d'); ctx.scale(k, k); ctx.drawImage(img, 0, 0);
      baixar(nome, c.toDataURL('image/png'));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
  }

  /* ================= estrutura de cada cartão ================= */
  /**
   * spec: { title, note, height, legend:[{label,color}], draw:function(box), table:{cols,rows}, tableAlways, empty }
   */
  function card(name, spec) {
    var root = $('[data-chart="' + name + '"]');
    if (!root) return;
    S.tables[name] = spec.table ? { title: spec.title, cols: spec.table.cols, rows: spec.table.rows } : null;
    var hasChart = !!spec.draw && !spec.empty;
    var actions = '';
    if (hasChart && spec.table && !spec.tableAlways) actions += '<button type="button" class="btn-link" data-act="table">Ver tabela</button>';
    if (hasChart) actions += '<button type="button" class="btn-link" data-act="png">PNG</button>';
    if (spec.table && !spec.empty) actions += '<button type="button" class="btn-link" data-act="csv">CSV</button>';

    root.innerHTML = '<div class="card-head"><div><h2 class="card-title">' + esc(spec.title) + '</h2>' +
      (spec.note ? '<p class="card-note">' + esc(spec.note) + '</p>' : '') + '</div>' +
      '<div class="card-actions">' + actions + '</div></div>' +
      (spec.legend && !spec.empty ? '<div class="legend">' + spec.legend.map(function (l) {
        return '<span><i style="background:' + l.color + '"></i>' + esc(l.label) + '</span>';
      }).join('') + '</div>' : '') +
      (spec.empty ? '<div class="empty">' + esc(spec.empty) + '</div>' :
        (hasChart ? '<div class="chart-box" aria-label="' + esc(spec.title) + '"></div>' : '') +
        (spec.table ? '<div class="data-table-wrap"' + (spec.tableAlways || !hasChart ? '' : ' hidden') + '>' + tableHtml(spec.table) + '</div>' : ''));

    if (hasChart) spec.draw($('.chart-box', root));
    $$('[data-act]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        var act = b.dataset.act;
        if (act === 'table') {
          var w = $('.data-table-wrap', root); w.hidden = !w.hidden; b.textContent = w.hidden ? 'Ver tabela' : 'Ocultar tabela';
        }
        if (act === 'png') svgPng($('.chart-box svg', root), slug(spec.title) + '.png');
        if (act === 'csv') baixarCsv(slug(spec.title) + '.csv', S.tables[name]);
      });
    });
  }

  function tableHtml(t) {
    return '<table class="data-table"><thead><tr>' + t.cols.map(function (c) {
      return '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.label) + '</th>';
    }).join('') + '</tr></thead><tbody>' + t.rows.map(function (r) {
      return '<tr>' + r.map(function (v, i) {
        var c = t.cols[i];
        var html = c.html ? c.html(v) : esc(c.num ? fmt(v, c.d == null ? 1 : c.d) : v);
        return '<td' + (c.num ? ' class="num"' : '') + '>' + html + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table>';
  }

  function baixar(nome, url) {
    var a = document.createElement('a'); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function baixarCsv(nome, t) {
    var linhas = [t.cols.map(function (c) { return c.label; })].concat(t.rows.map(function (r) {
      return r.map(function (v, i) {
        var c = t.cols[i];
        if (c.csv) return c.csv(v);
        return c.num ? (v == null ? '' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: c.d == null ? 1 : c.d, useGrouping: false })) : v;
      });
    }));
    var csv = '﻿' + linhas.map(function (r) {
      return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(';');
    }).join('\r\n');
    var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    baixar(nome, url);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ================= MATRIZ ================= */
  function renderMatriz() {
    var v = view();
    var grupos = agrupar(v.tarO).filter(function (g) { return g.imp != null && g.sat != null; });
    var shown = grupos.filter(function (g) { return g.n >= S.f.minCit; });
    var maxN = shown.reduce(function (m, g) { return Math.max(m, g.n); }, 1);
    var rank = shown.slice().sort(function (a, b) { return b.opp - a.opp || b.n - a.n; });
    var destaque = {};
    rank.slice(0, 6).forEach(function (g) { destaque[g.label] = true; });
    var pontos = shown.map(function (g) {
      return { x: g.sat, y: g.imp, r: 5 + 13 * Math.sqrt(g.n / maxN), label: g.label, g: g, rotulo: !!destaque[g.label] };
    });

    card('matriz', {
      title: 'Matriz Importância × Satisfação das tarefas',
      note: 'Médias por tarefa. Tamanho da bolha = número de citações. Rótulos nas 6 tarefas de maior índice de oportunidade.' +
        (grupos.length > shown.length ? ' ' + (grupos.length - shown.length) + ' tarefa(s) ocultas pelo filtro de mínimo de citações.' : ''),
      empty: shown.length ? '' : 'Nenhuma tarefa para os filtros escolhidos.',
      tableAlways: true,
      draw: function (box) {
        bubble(box, {
          points: pontos, height: Math.min(560, Math.max(380, (box.clientWidth || 700) * 0.62)),
          tooltip: function (p) {
            var g = p.g;
            return '<b>' + esc(g.label) + '</b>' + tipRow(null, 'Importância: ' + fmt(g.imp, 2) + ' · Satisfação: ' + fmt(g.sat, 2)) +
              tipRow(null, g.n + ' citação(ões) · oportunidade ' + fmt(g.opp, 2)) + tipRow(null, QUADRANTES[g.quad]);
          }
        });
      },
      table: {
        cols: [
          { label: '#', num: true, d: 0 }, { label: 'Tarefa / categoria' }, { label: 'Citações', num: true, d: 0 },
          { label: 'Importância média', num: true, d: 2 }, { label: 'Satisfação média', num: true, d: 2 },
          { label: 'Lacuna (imp − sat)', num: true, d: 2 }, { label: 'Índice de oportunidade', num: true, d: 2 },
          { label: 'Quadrante', html: function (q) { return '<span class="quad' + (q === 'prio' ? ' prio' : '') + '">' + esc(QUADRANTES[q]) + '</span>'; }, csv: function (q) { return QUADRANTES[q]; } },
          { label: '% manual', num: true, d: 0 }
        ],
        rows: rank.map(function (g, i) {
          return [i + 1, g.label, g.n, g.imp, g.sat, g.gap, g.opp, g.quad, pct(g.modo['Manual'] || 0, g.n)];
        })
      }
    });
  }

      table: {
        cols: [{ label: 'Tarefa / categoria' }, { label: 'Categoria definida?' }, { label: 'Citações', num: true, d: 0 }, { label: 'Textos agrupados' }],
        rows: grupos.map(function (g) { return [g.label, g.categorizada ? 'Sim' : 'Não', g.n, g.variantes.join(' · ')]; })
      }
    });
  }

  /* ================= navegação e carga ================= */
  var RENDER = { visao: renderVisao, matriz: renderMatriz, modo: renderModo, barreiras: renderBarreiras, tecnologias: renderTecnologias, abertas: renderAbertas, categorias: renderCategorias };

  function render() {
    if (!S.raw) return;
    var v = view();
    $('#filterCount').textContent = v.resp.length + ' de ' + S.raw.respostas.length + ' respostas nos filtros';
    RENDER[S.tab]();
  }

  function setTab(tab) {
    S.tab = tab;
    document.body.dataset.tab = tab;
    $$('#tabs button').forEach(function (b) { var on = b.dataset.tab === tab; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
    $$('.tab-panel').forEach(function (p) { p.hidden = p.dataset.panel !== tab; });
    render();
  }

  function carregar() {
    $('#loading').hidden = false;
    $('#alert').hidden = true;
    $('#reloadBtn').disabled = true;
    google.script.run
      .withSuccessHandler(function (d) {
        S.raw = d;
        $('#loading').hidden = true;
        $('#main').hidden = false;
        $('#reloadBtn').disabled = false;
        $('#metaLine').textContent = d.respostas.length + ' respostas na planilha · dados atualizados em ' + d.geradoEm;
        var lp = $('#linkPlanilha'); lp.href = d.planilhaUrl; lp.hidden = !d.planilhaUrl;
        var la = $('#linkAnalise'); la.href = d.analiseUrl; la.hidden = !d.analiseUrl;
        var areas = {};
        d.respostas.forEach(function (r) { areasDe(r).forEach(function (a) { areas[a] = 1; }); });
        var atual = $('#fArea').value;
        $('#fArea').innerHTML = '<option value="">Todas</option>' + Object.keys(areas).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); })
          .map(function (a) { return '<option' + (a === atual ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('');
        S.f.area = $('#fArea').value;
        setTab(S.tab);
      })
      .withFailureHandler(function (e) {
        $('#loading').hidden = true;
        $('#reloadBtn').disabled = false;
        var a = $('#alert'); a.hidden = false;
        a.textContent = 'Não foi possível carregar os dados: ' + (e && e.message ? e.message : e);
      })
      .getDados();
  }

  function init() {
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 200); });
    $('#openQuestion').innerHTML = PERGUNTAS.map(function (p) { return '<option value="' + p.id + '">' + esc(p.label) + '</option>'; }).join('');
    $$('#tabs button').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });
    $('#fPerfil').addEventListener('change', function (e) { S.f.perfil = e.target.value; render(); });
    $('#fArea').addEventListener('change', function (e) { S.f.area = e.target.value; render(); });
    $('#fOrigem').addEventListener('change', function (e) { S.f.origem = e.target.value; render(); });
    $('#fMinCit').addEventListener('change', function (e) { S.f.minCit = Number(e.target.value); render(); });
    $('#openQuestion').addEventListener('change', renderAbertas);
    $('#openSearch').addEventListener('input', renderAbertas);
    $('#openCsv').addEventListener('click', function () {
      var p = $('#openQuestion').selectedOptions[0].textContent;
      baixarCsv(slug(p) + '.csv', { cols: [{ label: 'Resposta' }, { label: 'Tarefa/tecnologia' }, { label: 'Perfil' }, { label: 'Áreas' }, { label: 'ID' }],
        rows: itensAbertos().map(function (i) { return [i.texto, i.contexto, i.perfil, i.areas, i.id]; }) });
    });
    $('#reloadBtn').addEventListener('click', carregar);
    $('#catBtn').addEventListener('click', function () {
      var b = $('#catBtn'); b.disabled = true; $('#catMsg').textContent = 'Atualizando a planilha de análises…';
      google.script.run
        .withSuccessHandler(function (r) {
          b.disabled = false;
          $('#catMsg').textContent = 'Lista atualizada: ' + r.total + ' tarefa(s), ' + r.novas + ' nova(s). Preencha a coluna "categoria" na planilha de análises e depois clique em "Atualizar dados".';
          var la = $('#linkAnalise'); la.href = r.url; la.hidden = false;
        })
        .withFailureHandler(function (e) { b.disabled = false; $('#catMsg').textContent = 'Erro: ' + (e && e.message ? e.message : e); })
        .atualizarCategorias();
    });
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onScheme = function () { render(); };
      if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
    }
    document.body.dataset.tab = S.tab;
    carregar();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
